[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pmagent"
version = "0.1.0"
description = "Petal Maps render engine Q&A, fault localization and patch suggestion agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
pmagent = "pmagent.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/pmagent/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = false
warn_unused_ignores = true
